<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact | Ernani O. Sabado Jr.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: system-ui, sans-serif; line-height: 1.6; }

        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background-color: #000000; border-bottom: 1px solid #222; }
        .header-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 1.3rem; font-weight: 800; color: #ffffff; text-decoration: none; }

        .nav-links a:hover, .nav-links a.active { color: #ffffff; }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .btn { padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; }
        .btn-outline { background-color: transparent; color: #ffffff; border: 1px solid #333; }
        .btn-outline:hover { border-color: #666; background-color: #1e1e1e; }
        .btn-primary { background-color: #0066ff; color: #ffffff; border: none; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .contact-card { padding: 40px; background-color: #1a1a1a; border-radius: 12px; border: 1px solid #262626; }
        .contact-card h1 { font-size: 2rem; margin-bottom: 15px; color: #0066ff; }
        .contact-card p { color: #b0b0b0; margin-bottom: 20px; }
